name: collect
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - run: python -m unittest -q
      - run: python collect.py data/skins.json
      - name: commit data
        working-directory: data
        run: |
          git add skins.json
          git diff --cached --quiet && exit 0
          n=$(python3 -c "import json; print(len(json.load(open('skins.json'))['skins']))")
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -q -m "data: $n skins"
          git push
